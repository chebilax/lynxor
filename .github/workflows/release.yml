name: Release

# Triggered on a version tag push -- publishes precompiled binaries
# (linux/darwin/windows, amd64/arm64) as GitHub Release assets via
# GoReleaser (see .goreleaser.yaml, docs/decisions/0020-goreleaser.md), then
# publishes the npm facade package (see npm/, docs/decisions/0021-npm-distribution.md)
# once those assets exist -- its postinstall script downloads them.
on:
  push:
    tags:
      - "v*"

# Workflow-level default; each job narrows this to what it actually needs.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Scoped, not write-all (which lynxor's own cicd analyzer would flag) --
    # only the one permission GoReleaser actually needs to create a release
    # and upload assets. lynxor-self-check.yml stays read-only; this is
    # the only job in this repo that legitimately needs write access.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history to generate release notes from commits

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Same checklist every PR in this project runs before merge (see
      # Makefile) -- a tag is cut from main, which already passed this in
      # its own PR, but a release artifact is expensive to get wrong, so
      # this is checked again right before publishing rather than assumed.
      - name: Verify build
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: release # must run after the binaries it downloads at install time actually exist
    runs-on: ubuntu-latest
    # id-token: write is what lets npm's trusted-publishing (OIDC) flow mint
    # a short-lived publish token for this job -- no NPM_TOKEN secret exists
    # at all (ADR 0021 update). Scoped to this job only, not the workflow
    # default, so no other job in this file can mint one.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14.0
          # (npmjs.com/docs/trusted-publishers) -- 20 (the prior pin) is
          # below both floors.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # package.json ships with a 0.0.0 placeholder in git; the real version
      # is always the tag that triggered this run, stripped of its "v" (npm
      # versions don't take the leading "v" that every other build path in
      # this project uses -- see docs/decisions/0013-version-flag.md).
      - name: Set package version from tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      # No NODE_AUTH_TOKEN: trusted publishing authenticates via the
      # id-token above, not a long-lived secret. Provenance attestation is
      # automatic under trusted publishing -- no --provenance flag needed.
      - name: Publish
        run: npm publish --access public
